services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: campusjudge
      POSTGRES_USER: campusjudge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - campusjudge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  campusjudge-postgres:
    name: campusjudge-postgres
